<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fullscreen Overlay</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: system-ui, sans-serif;
    user-select: none;
    touch-action: none;
  }
  #screen {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: #000;
    z-index: 999999;
    cursor: none;
  }
  #screen img {
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    image-rendering: auto;
  }
  #start {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: #111;
    color: white;
    z-index: 1000000;
    cursor: default;
  }
  #start button {
    font: 900 28px/1 system-ui, sans-serif;
    letter-spacing: 2px;
    padding: 20px 34px;
    border: 2px solid rgba(255,255,255,.35);
    border-radius: 14px;
    cursor: pointer;
    color: #fff;
    background: #050505;
    text-shadow:
      2px 0 0 #ff1744,
      -2px 0 0 #00e5ff,
      0 2px 0 #76ff03;
    box-shadow: 0 0 25px rgba(255,255,255,.12);
    animation: rgbText 1.2s linear infinite, pulse 1.5s ease-in-out infinite;
  }

  #start button:hover {
    transform: scale(1.05);
  }

  @keyframes rgbText {
    0%   { text-shadow: 3px 0 #ff1744, -3px 0 #00e5ff, 0 3px #76ff03; }
    33%  { text-shadow: 0 3px #ff1744, 3px 0 #00e5ff, -3px 0 #76ff03; }
    66%  { text-shadow: -3px 0 #ff1744, 0 -3px #00e5ff, 3px 0 #76ff03; }
    100% { text-shadow: 3px 0 #ff1744, -3px 0 #00e5ff, 0 3px #76ff03; }
  }

  @keyframes pulse {
    50% { box-shadow: 0 0 35px rgba(255,255,255,.3); }
  }
  #hint {
    position: fixed;
    bottom: 18px;
    left: 0;
    right: 0;
    text-align: center;
    color: #777;
    font-size: 12px;
    pointer-events: none;
  }
</style>
</head>

    <button id="go">UNLOCK PROXY!</button>
  </div>

<script>
(() => {
  const start = document.getElementById('start');
  const screen = document.getElementById('screen');
  const audio = document.getElementById('audio');

  // Prevent normal page scrolling/selection/context menus.
  for (const ev of ['contextmenu','dragstart','selectstart']) {
    document.addEventListener(ev, e => e.preventDefault());
  }
  document.addEventListener('keydown', e => {
    if (start.style.display !== 'none') return;
    // Keep the overlay from responding to normal browser-page shortcuts.
    if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'].includes(e.code)) {
      e.preventDefault();
    }
  });

  async function enter() {
    start.style.display = 'none';
    screen.requestPointerLock?.();
    try {
      if (!document.fullscreenElement) {
        await document.documentElement.requestFullscreen();
      }
    } catch (_) {
      // Fullscreen can be denied by browser policy; the overlay still works.
    }
    try {
      audio.currentTime = 0;
      await audio.play();
    } catch (_) {
      // Browser autoplay policy may still require another user gesture.
    }
  }

  document.getElementById('go').addEventListener('click', enter);

  // Keep the overlay full-viewport. Browsers require a user gesture to
  // re-enter fullscreen, so automatic re-entry may be blocked after Esc.
  document.addEventListener('fullscreenchange', async () => {
    screen.style.inset = '0';
    if (start.style.display === 'none' && !document.fullscreenElement) {
      try { await document.documentElement.requestFullscreen(); } catch (_) {}
    }
  });
})();
</script>
